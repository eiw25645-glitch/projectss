<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โครงการ หจก.สรรเสริญการสร้าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#17325c;--ink:#1c2433;--mut:#6b7587;--bd:#e3e7ee;--bg:#f5f7fa;--blue:#2563eb;--red:#c62828;--grn:#1f8a5b;--amb:#b7791f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Noto Sans Thai",sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0;color:var(--navy)} h1{font-size:24px} h2{font-size:17px}
.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
[hidden]{display:none!important}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;margin-top:3px}
input:focus,select:focus{outline:2px solid #9db8ee;border-color:var(--blue)}
input:disabled,select:disabled{background:#f1f3f7;color:var(--ink)}
.btn{font:inherit;font-weight:500;padding:8px 14px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f0f3f8}.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.dng{color:var(--red);border-color:#f0c4c4}
.card,.box{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:4px 0}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}#lf{width:min(400px,100%)}
#shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:18px;color:var(--navy);padding:0 8px 18px}.brand small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
nav a{display:block;padding:10px 12px;border-radius:10px;background:#eef2f9;color:var(--navy);font-weight:500;cursor:pointer}
.side-b{margin-top:auto;display:grid;gap:8px;font-size:13px;color:var(--mut)}
#save{padding:6px 10px;border-radius:8px;background:#e8f6ef;color:var(--grn);text-align:center}
#save[data-k=saving]{background:#fff6e0;color:var(--amb)}#save[data-k=err]{background:#fde8e8;color:var(--red);cursor:pointer}
.wrap{min-width:0}.tools{display:flex;justify-content:flex-end;padding:14px 24px 0}
main{padding:8px 24px 40px;max-width:1200px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin:6px 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px}.k b{display:block;font-size:22px;color:var(--navy)}.k span{font-size:13px;color:var(--mut)}
.k.r b{color:var(--red)}.k.g b{color:var(--grn)}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer}.pc:hover{border-color:#9db8ee}
.pc h3{font-size:16px;margin:8px 0 2px}.pc p{margin:0;font-size:13px;color:var(--mut)}
.mt{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}.mt b{font-size:14px}
.pg{height:8px;background:#e9edf3;border-radius:9px;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:var(--blue)}.pg.red i{background:var(--red)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
.gray{background:#eceff3;color:#4b5563}.blue{background:#e3edff;color:#1d4ed8}.amber{background:#fff1d6;color:#92600b}.violet{background:#ece8fb;color:#5b3fc4}.green{background:#dff3e8;color:#17704a}.slate{background:#dfe3ea;color:#2f3a4d}
.sec{margin-top:16px}.sec>h2{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}.grid .w2{grid-column:span 2}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;color:var(--mut);text-align:left;padding:6px;font-weight:500;white-space:nowrap}td{padding:3px}
td input,td select{margin:0;min-width:96px;padding:6px 8px}td input[type=number]{min-width:100px}
.x{border:0;background:none;cursor:pointer;font-size:16px}
.sumrow{font-weight:600;background:#f3f6fb}.sumrow td{padding:8px 10px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}ul.l{list-style:none;margin:6px 0 0;padding:0;font-size:14px}ul.l li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd)}
.cb{display:grid;grid-template-columns:130px 1fr 110px;gap:8px;align-items:center;font-size:13px;margin:6px 0}.cb i{display:block;height:10px;background:var(--navy);border-radius:6px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.printonly{display:none}.addb{margin-top:8px}
.viewer .ed{display:none!important}
@media(max-width:800px){
 #shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px}.brand{padding:0}nav{display:none}.side-b{margin:0 0 0 auto;display:flex;align-items:center}#who{display:none}
 main{padding:6px 14px 40px}.bar,.two{grid-template-columns:1fr}.grid .w2{grid-column:auto}.tools{padding:10px 14px 0}.cb{grid-template-columns:100px 1fr 90px}}
@page{size:A4;margin:14mm}
@media print{aside,.tools,.bar,.fl,.ed,.btn,.top .row,.x{display:none!important}
 #shell{display:block}body{background:#fff;font-size:12px}main{padding:0;max-width:none}.printonly{display:block;margin-bottom:8px}
 input,select{border:0;background:none;appearance:none;padding:0;min-width:0!important}table{min-width:0}.box,.k,.pc{break-inside:avoid}}
@media screen{
:root{--navy:#14145c;--blue:#2f6bff;--mut:#7b83a0;--bd:#eceff7}
body{background:#fff;color:#2a2f4a}
h1{font-size:28px;font-weight:700}
#shell{grid-template-columns:84px 1fr}
aside{width:84px;background:#f2f6ff;border:0;padding:22px 0;align-items:center;gap:6px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#2f6bff,#6cc1ff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:21px;box-shadow:0 8px 18px rgba(47,107,255,.35)}
nav{margin-top:22px}
nav a{width:48px;height:48px;padding:0;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#2f6bff,#5aa9ff);color:#fff;box-shadow:0 8px 18px rgba(47,107,255,.35)}
nav a svg{width:22px;height:22px}
.side-b{margin-top:auto;display:block}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffb26b,#ff7a8a);color:#fff;display:grid;place-items:center;font-weight:600;cursor:pointer;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tools{display:flex;justify-content:flex-end;padding:20px 32px 0}
#save{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;background:#e3f7ec;color:#17844f;text-align:center}
main{padding:8px 32px 48px;max-width:1240px}
.box,.card,.k,.pc{border:0;border-radius:22px;box-shadow:0 10px 30px rgba(60,90,160,.10)}
.box>h2::before{content:"";display:inline-block;width:6px;height:18px;border-radius:4px;margin-right:8px;vertical-align:-3px;background:linear-gradient(#2f6bff,#6cc1ff)}
.btn{border-radius:99px;border:0;box-shadow:0 4px 14px rgba(60,90,160,.12);padding:9px 18px}
.btn.pri{background:linear-gradient(135deg,#2f6bff,#5aa9ff);box-shadow:0 8px 18px rgba(47,107,255,.35)}
.btn.dng{background:#fff0f0}
.bar{grid-template-columns:2fr 1fr 1fr}
.bar input,.bar select,.fl input,.fl select{border:0;border-radius:99px;padding:11px 18px;box-shadow:0 4px 16px rgba(60,90,160,.12)}
.k{background:#eef3ff}.k b{color:var(--navy);font-size:24px}.k.r b{color:#d62f4b}.k.g b{color:#17844f}
.kpis .k:nth-child(1){background:linear-gradient(160deg,#fff3ea,#ffdfca)}
.kpis .k:nth-child(2){background:linear-gradient(160deg,#eef3ff,#d5e3ff)}
.kpis .k:nth-child(3){background:linear-gradient(160deg,#e8f8ff,#cbeeff)}
.kpis .k:nth-child(4){background:linear-gradient(160deg,#eefaf1,#d2f2dd)}
.kpis .k:nth-child(5){background:linear-gradient(160deg,#f6efff,#e3d6ff)}
.pc{background:#f2f6ff;padding:20px}
.pc[data-c=blue]{background:linear-gradient(160deg,#f3f7ff,#d9e8ff)}
.pc[data-c=amber]{background:linear-gradient(160deg,#fff7ec,#ffe3c2)}
.pc[data-c=green]{background:linear-gradient(160deg,#f0fbf4,#d0f1dc)}
.pc[data-c=violet]{background:linear-gradient(160deg,#f7f1ff,#e2d5ff)}
.pc[data-c=gray]{background:linear-gradient(160deg,#f6f7fa,#e5e8ef)}
.pc[data-c=slate]{background:linear-gradient(160deg,#f1f3f8,#dbe0ea)}
.pc:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(60,90,160,.2)}.pc{transition:.15s}
.pc h3{font-size:17px}.pc .site{color:#4a5272}
.vb{margin-top:14px;background:#fff;border-radius:99px;text-align:center;padding:9px;font-weight:600;color:var(--navy);box-shadow:0 6px 16px rgba(60,90,160,.12)}
.pg{height:9px;background:rgba(255,255,255,.75)}.pg i{background:linear-gradient(90deg,#2f6bff,#6cc1ff)}.pg.red i{background:linear-gradient(90deg,#ff8a3d,#e5384f)}
.badge{padding:3px 12px}
th{background:#f2f6ff}th:first-child{border-radius:10px 0 0 10px}
.sumrow{background:#e6eeff;border-radius:12px}
.cb i{background:linear-gradient(90deg,#2f6bff,#6cc1ff)}
.cb:nth-of-type(8n+2) i{background:linear-gradient(90deg,#ff8a3d,#ffc36b)}
.cb:nth-of-type(8n+3) i{background:linear-gradient(90deg,#17b26a,#7be0a8)}
.cb:nth-of-type(8n+4) i{background:linear-gradient(90deg,#8a5cf6,#c2a6ff)}
.cb:nth-of-type(8n+5) i{background:linear-gradient(90deg,#ff5d8f,#ffa3c0)}
.cb:nth-of-type(8n+6) i{background:linear-gradient(90deg,#14b8c4,#7de3ea)}
.cb:nth-of-type(8n+7) i{background:linear-gradient(90deg,#e5b800,#ffe27a)}
.cb:nth-of-type(8n+8) i{background:linear-gradient(90deg,#64748b,#aab4c4)}
@media(max-width:800px){#shell{grid-template-columns:1fr}aside{width:auto;flex-direction:row;padding:10px 14px;gap:12px}.logo,nav a,.av{width:40px;height:40px}nav{display:block;margin:0}.side-b{margin:0 0 0 auto}#who{display:grid}.tools{padding:10px 14px 0}main{padding:6px 14px 40px}.bar{grid-template-columns:1fr}}
}
</style>
</head>
<body>
<div id="shell">
  <aside>
    <div class="logo">ส</div>
    <nav><a id="nhome" title="โครงการทั้งหมด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></a></nav>
    <div class="side-b"><div id="who" class="av"></div></div>
  </aside>
  <div class="wrap">
    <div class="tools"><div id="save" data-k="ok">บันทึกแล้ว ✓</div></div>
        <main id="main"></main>
  </div>
</div>
<datalist id="dln"></datalist><datalist id="dla"></datalist><datalist id="dlp"></datalist>
<script type="module" src="app.js"></script>
</body>
</html>
